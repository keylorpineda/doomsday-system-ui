name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Un push nuevo al mismo PR/rama cancela la corrida anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  HUSKY: 0 # Los hooks de git no hacen falta en CI

jobs:
  quality:
    name: Lint · Spell · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Versión de pnpm tomada de "packageManager" en package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Spell check
        run: pnpm spell

      # `build` corre `tsc` (type check) y luego `vite build`
      - name: Type check + build
        run: pnpm build

  test:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      # Versión de pnpm tomada de "packageManager" en package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  # Único check a marcar como requerido en la protección de ramas
  ci:
    name: CI
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
